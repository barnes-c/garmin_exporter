---
# Temporary: exercises the release SBOM/signing changes against a throwaway
# image. Delete before merging fix/sbom.
name: SBOM test
on:
  push:
    branches: [fix/sbom]

permissions:
  contents: read

env:
  TEST_IMAGE: ghcr.io/barnes-c/garmin_exporter-test
  GORELEASER_CURRENT_TAG: v0.0.0-sbomtest.${{ github.run_number }}

jobs:
  sbom-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Derive test config from release config
        run: |
          yq '
            .dockers_v2[0].images = [strenv(TEST_IMAGE)]
            | .dockers_v2[0].tags = ["{{ .Version }}"]
            | .release.disable = true
            | .changelog.disable = true
          ' .github/.goreleaser.yml > "$RUNNER_TEMP/goreleaser.test.yml"
          cat "$RUNNER_TEMP/goreleaser.test.yml"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --config ${{ runner.temp }}/goreleaser.test.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keep in sync with "Attest container SBOMs" in release.yml.
      - name: Attest container SBOMs
        run: |
          set -euo pipefail
          jq -r '[.[] | select(.type=="Docker Image")] | group_by((.name | split(":")[0]) + "@" + .extra.Digest) | .[] | .[0] | "\(.name|split(":")[0]) \(.extra.Digest)"' dist/artifacts.json \
            | while read -r repo digest; do
                [ -z "$repo" ] && continue
                ref="${repo}@${digest}"
                docker buildx imagetools inspect --raw "$ref" \
                  | jq -r '.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"' \
                  | while read -r platform; do
                      echo "::group::SBOM for $ref ($platform)"
                      syft "$ref" --platform "$platform" -o spdx-json=sbom.spdx.json
                      cosign attest --type spdxjson --predicate sbom.spdx.json --yes "$ref"
                      echo "::endgroup::"
                    done
              done

      - name: Verify
        run: |
          set -euo pipefail
          ref="${TEST_IMAGE}:${GORELEASER_CURRENT_TAG#v}"
          id=(--certificate-identity-regexp "^https://github.com/barnes-c/garmin_exporter/"
              --certificate-oidc-issuer https://token.actions.githubusercontent.com)

          echo "::group::No BuildKit SBOM in the index"
          sbom=$(docker buildx imagetools inspect "$ref" --format '{{ json .SBOM }}')
          echo "$sbom"
          if grep -q spdxVersion <<< "$sbom"; then echo "BuildKit SBOM still present"; exit 1; fi
          echo "::endgroup::"

          echo "::group::Signature on the index"
          cosign verify "$ref" "${id[@]}" > /dev/null
          echo "::endgroup::"

          for arch in amd64 arm64; do
            echo "::group::$arch"
            digest=$(docker buildx imagetools inspect --raw "$ref" \
              | jq -r --arg a "$arch" '.manifests[] | select(.platform.architecture == $a) | .digest')
            cosign verify "${TEST_IMAGE}@${digest}" "${id[@]}" > /dev/null

            # Same command as in the release notes.
            cosign verify-attestation --type spdxjson "$ref" "${id[@]}" \
              | jq -r .payload | base64 -d \
              | jq --arg a "$arch" '.predicate | select(any(.packages[].externalRefs[]?; .referenceLocator | test("^pkg:oci/.*arch=" + $a)))' \
              > "sbom-$arch.json"
            [ "$(jq -s length "sbom-$arch.json")" = 1 ] || { echo "expected exactly one $arch SBOM"; exit 1; }
            jq -r '[.packages[].externalRefs[]?.referenceLocator | capture("arch=(?<a>[^&]+)").a] | unique | join(" ")' "sbom-$arch.json"
            echo "::endgroup::"
          done
